<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonctionnement des infrastructures – Atlas INS Guinée</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
<style>
:root{--vert-fonce:#00321f;--vert:#009460;--rouge:#CE1126;--jaune:#FCD116;--encre:#0f2a1e;--gris:#5b6660}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--encre)}
body{display:flex;flex-direction:column;background:#e9ece8}
.drapeau{display:grid;grid-template-columns:1fr 1fr 1fr;height:5px;flex:none}
.drapeau span:nth-child(1){background:var(--rouge)}.drapeau span:nth-child(2){background:var(--jaune)}.drapeau span:nth-child(3){background:var(--vert)}
header{flex:none;height:56px;background:var(--vert-fonce);color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 14px;gap:12px}
header a.accueil{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:15px}
header a.accueil svg{width:28px;height:28px}
header img{width:38px;height:38px;border-radius:50%;background:#fff}
header h1{margin:0;text-align:center;font-size:20px;font-weight:700}
.filtres{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid #cfd6d1}
.filtres label{font-size:14px;color:var(--gris)}
.filtres select{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--vert);border-radius:4px;color:var(--vert-fonce);background:#fff;min-width:260px}
.compte{font-size:13px;color:#5b6660}
#carte{flex:1;min-height:0}
.etat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:14px 18px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:15px;max-width:420px;text-align:center}
@media (max-width:600px){header h1{font-size:16px} header a.accueil span{display:none} .filtres{flex-wrap:wrap} .filtres select{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="drapeau"><span></span><span></span><span></span></div>
<header>
<a class="accueil" href="https://claude.ai/artifact/AvuYWmgLAZfK94ptuLGvCp" target="_top" title="Retour à l'accueil de l'atlas">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
<img src="https://instatguinee.maps.arcgis.com/sharing/rest/portals/exuJdDJNL2AsHUOf/resources/thumbnail1704805144991.png" alt="Logo INS Guinée"><span>Accueil</span></a>
<h1 id="titre">Taux de fonctionnement des infrastructures</h1><span></span>
</header>
<div class="filtres">
<label for="domaine">Domaine</label>
<select id="domaine" disabled><option value="">Tous les domaines</option></select>
<span class="compte" id="compte"></span>
</div>
<div id="carte" style="position:relative"><div class="etat" id="etat">Chargement de la carte… Si une fenêtre de connexion s'ouvre, connectez-vous avec votre compte ArcGIS de l'INS.</div></div>
<script src="https://js.arcgis.com/4.31/"></script>
<script>
require(["esri/WebMap","esri/views/MapView","esri/layers/FeatureLayer","esri/Graphic","esri/widgets/Legend","esri/widgets/Expand","esri/widgets/Home","esri/config"],
function (WebMap, MapView, FeatureLayer, Graphic, Legend, Expand, Home, esriConfig) {
esriConfig.portalUrl = "https://instatguinee.maps.arcgis.com";
const F_DOM = "Domaine_in", F_CODE = "Code_PREFE", F_STATUT = "Statut_Fon";
const etat = document.getElementById("etat"), select = document.getElementById("domaine"), titre = document.getElementById("titre"), compte = document.getElementById("compte");
const nf = new Intl.NumberFormat("fr-FR");
const ACCENTS = { EDUCATION: "éducation", SANTE: "santé", ELECTRICITE: "électricité", SACRE: "sacré", PRIVEE: "privée", PRIVE: "privé", ACTIVITES: "activités", SECURITE: "sécurité", TELECOMMUNICATION: "télécommunication", HOTELERIE: "hôtellerie", ETABLISSEMENT: "établissement" };
function joli(nom) { const s = String(nom).trim().replace(/[A-Za-zÀ-ÿ]+/g, m => ACCENTS[m.toUpperCase()] || m.toLowerCase()).replace(/\s+/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); }
const map = new WebMap({ portalItem: { id: "f6a9c7b2260744fc839f05909ce32420" } });
const view = new MapView({ container: "carte", map, center: [-11.2, 10.3], zoom: 7 });
view.ui.add(new Home({ view }), "top-left");
view.ui.add(new Expand({ view, content: new Legend({ view }), expanded: true, expandTooltip: "Légende" }), "bottom-right");
const infra = new FeatureLayer({ portalItem: { id: "c223bfaeaed04f7e98d48c78b80cad8d" }, layerId: 0 });
const pref = new FeatureLayer({ portalItem: { id: "a60cca7153df4f689777eb610200a684" } });
const COULEURS = ["#eff3ff","#bdd7e7","#6baed6","#3182bd","#08519c"];
const CLASSES = [[0,70,"Moins de 70 %"],[70,80,"70 à 80 %"],[80,90,"80 à 90 %"],[90,95,"90 à 95 %"],[95,100.01,"95 % et plus"]];
const contour = { color: [255,255,255,0.9], width: 0.8 };
const renderer = { type: "class-breaks", field: "TAUX", defaultSymbol: { type: "simple-fill", color: "#d9d9d9", outline: contour }, defaultLabel: "Aucune infrastructure de ce domaine",
 classBreakInfos: CLASSES.map((c,i) => ({ minValue: c[0], maxValue: c[1], label: c[2], symbol: { type: "simple-fill", color: COULEURS[i], outline: contour } })) };
const etiquettes = [{ labelExpressionInfo: { expression: "$feature.N_PREFECTU" }, symbol: { type: "text", color: "#0f2a1e", haloColor: "#ffffff", haloSize: 1.2, font: { size: 9, weight: "bold" } }, minScale: 6000000 }];
const popup = { title: "Préfecture de {N_PREFECTU} (région de {N_REGION})", content: [{ type: "fields", fieldInfos: [
 { fieldName: "TAUX", label: "Taux de fonctionnement (%)", format: { places: 1, digitSeparator: true } },
 { fieldName: "NB_TOT", label: "Nombre d'infrastructures", format: { places: 0, digitSeparator: true } },
 { fieldName: "NB_FONCT", label: "Fonctionnelles", format: { places: 0, digitSeparator: true } },
 { fieldName: "NB_NON", label: "Non fonctionnelles", format: { places: 0, digitSeparator: true } } ] }] };
let prefectures = [], couche = null; const cache = new Map();
const cle = v => v === null || v === undefined ? "" : String(v).trim();
const sqlTexte = v => "'" + String(v).replace(/'/g, "''") + "'";
async function statsDomaine(d) {
 if (cache.has(d)) return cache.get(d);
 const res = await infra.queryFeatures({ where: d ? F_DOM + " = " + sqlTexte(d) : "1=1", groupByFieldsForStatistics: [F_CODE, F_STATUT],
  outStatistics: [{ statisticType: "count", onStatisticField: infra.objectIdField, outStatisticFieldName: "N" }] });
 const pp = {};
 res.features.forEach(f => { const a = f.attributes, k = cle(a[F_CODE]); const p = pp[k] || (pp[k] = { tot: 0, fonct: 0 }); p.tot += a.N; if (a[F_STATUT] === "Fonctionnel") p.fonct += a.N; });
 cache.set(d, pp); return pp;
}
async function afficherDomaine(d) {
 select.disabled = true;
 try {
  const pp = await statsDomaine(d);
  let tot = 0, fonct = 0;
  new Set(prefectures.map(p => p.code)).forEach(c => { const s = pp[c]; if (s) { tot += s.tot; fonct += s.fonct; } });
  const g = prefectures.map((p, i) => { const s = pp[p.code]; return new Graphic({ geometry: p.geometry, attributes: { OID: i + 1, N_PREFECTU: p.nom, N_REGION: p.region,
   TAUX: s && s.tot ? Math.round(s.fonct / s.tot * 1000) / 10 : null, NB_TOT: s ? s.tot : 0, NB_FONCT: s ? s.fonct : 0, NB_NON: s ? s.tot - s.fonct : 0 } }); });
  const nom = d ? joli(d) : "Tous les domaines";
  const n = new FeatureLayer({ title: "Taux de fonctionnement – " + nom, source: g, objectIdField: "OID",
   fields: [{ name: "OID", type: "oid" },{ name: "N_PREFECTU", type: "string" },{ name: "N_REGION", type: "string" },{ name: "TAUX", type: "double" },{ name: "NB_TOT", type: "integer" },{ name: "NB_FONCT", type: "integer" },{ name: "NB_NON", type: "integer" }],
   renderer, labelingInfo: etiquettes, popupTemplate: popup, opacity: 0.9 });
  if (couche) map.remove(couche); couche = n;
  const ir = map.layers.findIndex(l => l.title === "LIMITES REGIONS"); map.add(couche, ir >= 0 ? ir : map.layers.length);
  titre.textContent = d ? "Taux de fonctionnement – " + nom : "Taux de fonctionnement des infrastructures";
  compte.textContent = nf.format(tot) + " infrastructures, dont " + nf.format(fonct) + " fonctionnelles" + (tot ? " (" + (Math.round(fonct / tot * 1000) / 10).toLocaleString("fr-FR") + " %)" : "");
  view.closePopup();
 } catch (e) { console.error(e); compte.textContent = "Erreur de calcul pour ce domaine."; } finally { select.disabled = false; }
}
(async function () {
 try {
  await map.load();
  map.layers.forEach(l => { if (l.title !== "LIMITES REGIONS") l.visible = false; });
  await Promise.all([infra.load(), pref.load()]);
  const rp = await pref.queryFeatures({ where: "1=1", outFields: ["C_PREFECTU","N_PREFECTU","N_REGION"], returnGeometry: true, outSpatialReference: view.spatialReference });
  prefectures = rp.features.map(f => ({ code: cle(f.attributes.C_PREFECTU), nom: f.attributes.N_PREFECTU, region: f.attributes.N_REGION, geometry: f.geometry }));
  const rd = await infra.queryFeatures({ where: "1=1", groupByFieldsForStatistics: [F_DOM], outStatistics: [{ statisticType: "count", onStatisticField: infra.objectIdField, outStatisticFieldName: "N" }] });
  rd.features.filter(f => cle(f.attributes[F_DOM]) !== "").sort((a, b) => b.attributes.N - a.attributes.N).forEach(f => {
   const o = document.createElement("option"); o.value = f.attributes[F_DOM]; o.textContent = joli(f.attributes[F_DOM]) + " (" + nf.format(f.attributes.N) + ")"; select.appendChild(o); });
  etat.remove();
  select.addEventListener("change", () => afficherDomaine(select.value));
  await afficherDomaine("");
 } catch (err) { console.error(err); etat.textContent = "Impossible d'ouvrir les données : connectez-vous à ArcGIS (compte INS) et réessayez."; }
})();
let dernier = null, enCours = false;
view.on("pointer-move", evt => {
 if (enCours || !couche) return; enCours = true;
 view.hitTest(evt, { include: [couche] }).then(res => { enCours = false; const r = res.results.find(x => x.graphic); if (!r) return;
  const k = couche.id + ":" + r.graphic.attributes.OID; if (k === dernier && view.popup.visible) return; dernier = k;
  view.openPopup({ features: [r.graphic], location: view.toMap(evt) }); }).catch(() => { enCours = false; });
});
});
</script>
</body>
</html>
