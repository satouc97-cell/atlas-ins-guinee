<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonctionnement des infrastructures – Atlas INS Guinée</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
<style>
:root{--vert-fonce:#00321f;--vert:#009460;--rouge:#CE1126;--jaune:#FCD116;--encre:#0f2a1e;--gris:#5b6660}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--encre)}
body{display:flex;flex-direction:column;background:#e9ece8}
.drapeau{display:grid;grid-template-columns:1fr 1fr 1fr;height:5px;flex:none}
.drapeau span:nth-child(1){background:var(--rouge)}.drapeau span:nth-child(2){background:var(--jaune)}.drapeau span:nth-child(3){background:var(--vert)}
header{flex:none;height:56px;background:var(--vert-fonce);color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 14px;gap:12px}
header a.accueil{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:15px}
header a.accueil svg{width:28px;height:28px}
header img{width:38px;height:38px;border-radius:50%;background:#fff}
header h1{margin:0;text-align:center;font-size:20px;font-weight:700}
.filtres{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid #cfd6d1}
.filtres label{font-size:14px;color:var(--gris)}
.filtres select{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--vert);border-radius:4px;color:var(--vert-fonce);background:#fff;min-width:260px}
.compte{font-size:13px;color:#5b6660}
#carte{flex:1;min-height:0}
.etat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:14px 18px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:15px;max-width:420px;text-align:center}
@media (max-width:600px){header h1{font-size:16px} header a.accueil span{display:none} .filtres{flex-wrap:wrap} .filtres select{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="drapeau"><span></span><span></span><span></span></div>
<header>
<a class="accueil" href="https://claude.ai/artifact/AvuYWmgLAZfK94ptuLGvCp" target="_top" title="Retour à l'accueil de l'atlas">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
<img src="https://instatguinee.maps.arcgis.com/sharing/rest/portals/exuJdDJNL2AsHUOf/resources/thumbnail1704805144991.png" alt="Logo INS Guinée"><span>Accueil</span></a>
<h1 id="titre">Taux de fonctionnement des infrastructures</h1><span></span>
</header>
<div class="filtres">
<label for="domaine">Domaine</label>
<select id="domaine" disabled><option value="">Tous les domaines</option></select>
<span class="compte" id="compte"></span>
</div>
<div id="carte" style="position:relative"><div class="etat" id="etat">Chargement de la carte…</div></div>
<script src="https://js.arcgis.com/4.31/"></script>
<script>
require([
"esri/Map", "esri/WebMap", "esri/Basemap", "esri/layers/TileLayer", "esri/views/MapView",
"esri/layers/FeatureLayer", "esri/Graphic", "esri/widgets/Legend", "esri/widgets/Expand", "esri/widgets/Home", "esri/config"
], function (EsriMap, WebMap, Basemap, TileLayer, MapView, FeatureLayer, Graphic, Legend, Expand, Home, esriConfig) {
esriConfig.portalUrl = "https://instatguinee.maps.arcgis.com";
// Éléments ArcGIS de l'INS (aucune couche CONCESSION n'est utilisée)
const WEBMAP_ID = "f6a9c7b2260744fc839f05909ce32420";
const INFRA_ID  = "c223bfaeaed04f7e98d48c78b80cad8d";
const PREF_ID   = "a60cca7153df4f689777eb610200a684";
const F_DOM = "Domaine_in", F_CODE = "Code_PREFE", F_STATUT = "Statut_Fon";
// Domaines lus dans la couche des infrastructures (novembre 2026), affichés avant la connexion.
// Après la connexion, la liste est relue dans la couche et complétée si un domaine s'ajoute.
const DOMAINES = ["Lieu de culte", "Eau et électricité", "Éducation", "Commerce et industrie", "Santé",
"Sports/loisir", "Lieu sacré", "Autres infrastructures", "Garage/menuiserie", "Administration privée et institution",
"Télécommunication", "Restauration/hôtellerie", "Administration publique", "Sécurité et protection civile",
"Formation", "Banque et établissement financier", "Transport", "Ouvrage de franchissement", "Social", "Culture"];
const etat = document.getElementById("etat");
const select = document.getElementById("domaine");
const titre = document.getElementById("titre");
const compte = document.getElementById("compte");
const nf = new Intl.NumberFormat("fr-FR");
const ACCENTS = { EDUCATION: "éducation", SANTE: "santé", ELECTRICITE: "électricité", SACRE: "sacré",
PRIVEE: "privée", PRIVE: "privé", ACTIVITES: "activités", SECURITE: "sécurité",
TELECOMMUNICATION: "télécommunication", HOTELERIE: "hôtellerie", ETABLISSEMENT: "établissement" };
function joli(nom) {
const s = String(nom).trim().replace(/[A-Za-zÀ-ÿ]+/g, m => ACCENTS[m.toUpperCase()] || m.toLowerCase()).replace(/\s+/g, " ");
return s.charAt(0).toUpperCase() + s.slice(1);
}
// Menu disponible tout de suite
function option(valeur, texte) { const o = document.createElement("option"); o.value = valeur; o.textContent = texte; return o; }
select.innerHTML = "";
const choix = option("", "— Choisissez un domaine —"); choix.disabled = true; choix.selected = true;
select.append(choix, option("*", "Tous les domaines"));
DOMAINES.forEach(d => select.appendChild(option(d, d)));
select.disabled = false;
// Fond de carte public : l'interface s'affiche sans connexion
const map = new EsriMap({ basemap: new Basemap({ title: "Topographique",
baseLayers: [new TileLayer({ url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer" })] }) });
const view = new MapView({ container: "carte", map, center: [-11.2, 10.3], zoom: 7 });
view.ui.add(new Home({ view }), "top-left");
const legende = new Expand({ view, content: new Legend({ view }), expanded: false, expandTooltip: "Légende" });
view.ui.add(legende, "bottom-right");
etat.textContent = "Choisissez un domaine dans le menu ci-dessus pour afficher le taux de fonctionnement par préfecture.";
const infra = new FeatureLayer({ portalItem: { id: INFRA_ID }, layerId: 0 });
const pref  = new FeatureLayer({ portalItem: { id: PREF_ID } });
const COULEURS = ["#eff3ff", "#bdd7e7", "#6baed6", "#3182bd", "#08519c"];
const CLASSES = [[0, 70, "Moins de 70 %"], [70, 80, "70 à 80 %"], [80, 90, "80 à 90 %"], [90, 95, "90 à 95 %"], [95, 100.01, "95 % et plus"]];
const contour = { color: [255, 255, 255, 0.9], width: 0.8 };
const renderer = { type: "class-breaks", field: "TAUX",
defaultSymbol: { type: "simple-fill", color: "#d9d9d9", outline: contour },
defaultLabel: "Aucune infrastructure de ce domaine",
classBreakInfos: CLASSES.map((c, i) => ({ minValue: c[0], maxValue: c[1], label: c[2], symbol: { type: "simple-fill", color: COULEURS[i], outline: contour } })) };
const etiquettes = [{ labelExpressionInfo: { expression: "$feature.N_PREFECTU" },
symbol: { type: "text", color: "#0f2a1e", haloColor: "#ffffff", haloSize: 1.2, font: { size: 9, weight: "bold" } }, minScale: 6000000 }];
const popup = { title: "Préfecture de {N_PREFECTU} (région de {N_REGION})",
content: [{ type: "fields", fieldInfos: [
{ fieldName: "TAUX", label: "Taux de fonctionnement (%)", format: { places: 1, digitSeparator: true } },
{ fieldName: "NB_TOT", label: "Nombre d'infrastructures", format: { places: 0, digitSeparator: true } },
{ fieldName: "NB_FONCT", label: "Fonctionnelles", format: { places: 0, digitSeparator: true } },
{ fieldName: "NB_NON", label: "Non fonctionnelles", format: { places: 0, digitSeparator: true } } ]}] };
let prefectures = [], couche = null, pret = null;
const brut = {};
const cache = new Map();
const cle = v => v === null || v === undefined ? "" : String(v).trim();
const sqlTexte = v => "'" + String(v).replace(/'/g, "''") + "'";
// Chargement des données au premier choix (la connexion ArcGIS est demandée à ce moment-là)
function preparer() {
if (pret) return pret;
pret = (async () => {
await Promise.all([infra.load(), pref.load()]);
const rp = await pref.queryFeatures({ where: "1=1", outFields: ["C_PREFECTU", "N_PREFECTU", "N_REGION"], returnGeometry: true, outSpatialReference: view.spatialReference });
prefectures = rp.features.map(f => ({ code: cle(f.attributes.C_PREFECTU), nom: f.attributes.N_PREFECTU, region: f.attributes.N_REGION, geometry: f.geometry }));
const rd = await infra.queryFeatures({ where: "1=1", groupByFieldsForStatistics: [F_DOM],
outStatistics: [{ statisticType: "count", onStatisticField: infra.objectIdField, outStatisticFieldName: "N" }] });
rd.features.filter(f => cle(f.attributes[F_DOM]) !== "").sort((a, b) => b.attributes.N - a.attributes.N).forEach(f => {
const valeur = f.attributes[F_DOM], lib = joli(valeur);
brut[lib] = valeur;
let o = [...select.options].find(x => x.value === lib);
if (!o) { o = option(lib, lib); select.appendChild(o); }
o.textContent = lib + " (" + nf.format(f.attributes.N) + ")";
});
try {
const wm = new WebMap({ portalItem: { id: WEBMAP_ID } });
await wm.load();
const regions = wm.layers.find(l => l.title === "LIMITES REGIONS");
if (regions) { wm.remove(regions); map.add(regions); }
} catch (e) { console.warn("Limites des régions non chargées", e); }
})();
pret.catch(() => { pret = null; });
return pret;
}
async function statsDomaine(domaine) {
if (cache.has(domaine)) return cache.get(domaine);
const res = await infra.queryFeatures({ where: domaine ? F_DOM + " = " + sqlTexte(domaine) : "1=1", groupByFieldsForStatistics: [F_CODE, F_STATUT],
outStatistics: [{ statisticType: "count", onStatisticField: infra.objectIdField, outStatisticFieldName: "N" }] });
const parPref = {};
res.features.forEach(f => { const a = f.attributes, k = cle(a[F_CODE]); const p = parPref[k] || (parPref[k] = { tot: 0, fonct: 0 }); p.tot += a.N; if (a[F_STATUT] === "Fonctionnel") p.fonct += a.N; });
cache.set(domaine, parPref);
return parPref;
}
async function afficherDomaine(domaine, nom) {
const parPref = await statsDomaine(domaine);
// Total national : chaque préfecture une seule fois (Conakry a deux polygones).
let tot = 0, fonct = 0;
new Set(prefectures.map(p => p.code)).forEach(c => { const s = parPref[c]; if (s) { tot += s.tot; fonct += s.fonct; } });
const graphiques = prefectures.map((p, i) => { const s = parPref[p.code]; return new Graphic({ geometry: p.geometry, attributes: {
OID: i + 1, N_PREFECTU: p.nom, N_REGION: p.region, TAUX: s && s.tot ? Math.round(s.fonct / s.tot * 1000) / 10 : null,
NB_TOT: s ? s.tot : 0, NB_FONCT: s ? s.fonct : 0, NB_NON: s ? s.tot - s.fonct : 0 } }); });
const nouvelle = new FeatureLayer({ title: "Taux de fonctionnement – " + nom, source: graphiques, objectIdField: "OID",
fields: [{ name: "OID", type: "oid" }, { name: "N_PREFECTU", type: "string" }, { name: "N_REGION", type: "string" }, { name: "TAUX", type: "double" },
{ name: "NB_TOT", type: "integer" }, { name: "NB_FONCT", type: "integer" }, { name: "NB_NON", type: "integer" }],
renderer, labelingInfo: etiquettes, popupTemplate: popup, opacity: 0.9 });
if (couche) map.remove(couche);
couche = nouvelle;
map.add(couche, 0);
titre.textContent = domaine ? "Taux de fonctionnement – " + nom : "Taux de fonctionnement des infrastructures";
compte.textContent = nf.format(tot) + " infrastructures, dont " + nf.format(fonct) + " fonctionnelles" + (tot ? " (" + (Math.round(fonct / tot * 1000) / 10).toLocaleString("fr-FR") + " %)" : "");
legende.expanded = true;
view.closePopup();
}
select.addEventListener("change", async () => {
const v = select.value;
select.disabled = true;
if (etat.isConnected) etat.textContent = "Chargement des données… Si une fenêtre de connexion s'ouvre, connectez-vous avec votre compte ArcGIS de l'INS.";
try {
await preparer();
if (v === "*") { await afficherDomaine("", "Tous les domaines"); }
else if (brut[v] !== undefined) { await afficherDomaine(brut[v], v); }
else { compte.textContent = "Ce domaine n'existe plus dans la couche des infrastructures."; return; }
if (etat.isConnected) etat.remove();
} catch (err) {
console.error(err);
if (etat.isConnected) etat.textContent = "Impossible d'ouvrir les données : connectez-vous à ArcGIS (compte INS), puis choisissez à nouveau un domaine.";
} finally { select.disabled = false; }
});
// Fiche au survol d'une préfecture
let dernier = null, enCours = false;
view.on("pointer-move", (evt) => {
if (enCours || !couche) return;
enCours = true;
view.hitTest(evt, { include: [couche] }).then(res => {
enCours = false;
const r = res.results.find(x => x.graphic);
if (!r) return;
const k = couche.id + ":" + r.graphic.attributes.OID;
if (k === dernier && view.popup.visible) return;
dernier = k;
view.openPopup({ features: [r.graphic], location: view.toMap(evt) });
}).catch(() => { enCours = false; });
});
});
</script>
</body>
</html>
